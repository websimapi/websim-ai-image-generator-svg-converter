<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image to SVG Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>AI Image Generator & SVG Converter</h1>
    <div class="input-area">
      <textarea id="prompt-input" placeholder="Enter your image prompt here..."></textarea>
      <div class="aspect-ratio-selector">
        <label for="aspect-ratio">Aspect Ratio:</label>
        <select id="aspect-ratio">
          <option value="1:1">1:1 (Square)</option>
          <option value="16:9">16:9 (Landscape)</option>
          <option value="9:16">9:16 (Portrait)</option>
          <option value="3:2">3:2</option>
          <option value="2:3">2:3</option>
          <option value="4:3">4:3</option>
        </select>
      </div>
      <button id="generate-btn">Generate Image</button>
    </div>
    
    <div class="output-area">
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Generating image and converting to SVG...</p>
      </div>
      
      <div id="result-container" class="hidden">
        <div class="tabs">
          <button class="tab-btn active" data-tab="original">Original</button>
          <button class="tab-btn" data-tab="svg">SVG</button>
        </div>
        
        <div class="tab-content">
          <div id="original-tab" class="tab-pane active">
            <div id="original-image-container"></div>
          </div>
          <div id="svg-tab" class="tab-pane">
            <div id="svg-container"></div>
          </div>
        </div>
        
        <div class="download-area">
          <button id="download-btn" disabled>Download SVG</button>
        </div>
      </div>
    </div>
  </div>
  
  <script type="importmap">
    {
      "imports": {
        "./Point.js": "https://cdn.jsdelivr.net/npm/potrace-js@0.0.6/src/Point.js",
        "./Curve.js": "https://cdn.jsdelivr.net/npm/potrace-js@0.0.6/src/Curve.js",
        "./Quad.js": "https://cdn.jsdelivr.net/npm/potrace-js@0.0.6/src/Quad.js",
        "./Sum.js": "https://cdn.jsdelivr.net/npm/potrace-js@0.0.6/src/Sum.js",
        "./utils": "https://cdn.jsdelivr.net/npm/potrace-js@0.0.6/src/utils.js",
        "potrace-js": "https://cdn.jsdelivr.net/npm/potrace-js@0.0.6/src/index.js"
      }
    }
  </script>
  
  <script src="script.js" type="module"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
